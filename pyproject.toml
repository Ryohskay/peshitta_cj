[project]
name = "peshitta-cj"
version = "0.0.0"
description = "A collection of tools and scripts to categorise Peshitta verses into Jewish and Christian authorship"
authors = [
    {name = "Ryohskay",email = "r.nagata.21@abdn.ac.uk"}
]
license = {text = "BSD-2-Clause"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn (>=1.6.1,<2.0.0)",
    "numpy (>=2.2.4,<3.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "text-fabric (>=13.0.6,<14.0.0)"
]

[tool.poetry]
packages = [
    { include = "classifier" },
    { include = "scraper" }
]

[tool.poetry.group.dev.dependencies]
sphinx-autobuild = "^2024.10.3"
ruff = "^0.11.4"
pytest = "^8.3.5"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
